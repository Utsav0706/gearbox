[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gearbox"
version = "0.1.0"
description = "LLM auto-router: sends each prompt to the cheapest model tier that still answers it well."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Utsav Jivani (Uv)" }]
# Only what the code imports today. Each milestone adds its own dependencies
# (LiteLLM in M1, FastAPI in M6...), so nothing sits here unused.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Exact pin, chosen two weeks after release: LiteLLM's PyPI package was compromised
    # in March 2026 (1.82.7/1.82.8), so upgrades are deliberate and reviewed.
    "litellm==1.105.1",
    # Router v3: local sentence embeddings + logistic regression (numpy at serve time).
    "sentence-transformers>=3.3",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    # The API service (M6).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Only for rebuilding the dataset (py -m gearbox.data.build); the service never needs it.
data = [
    "huggingface_hub>=0.26",
    "pyarrow>=17",
    # Message Batches for answering/judging the dataset at half price (1.x, as in Scout).
    "anthropic>=1.17,<2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",  # scripts/bench_tier_s.py asks Ollama what is loaded
]

[tool.hatch.build.targets.wheel]
packages = ["src/gearbox"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
