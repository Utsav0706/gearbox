<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<style>
.surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
.muted { fill: #898781; } .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
.ring { stroke: #fcfcfb; }
.router { fill: #2a78d6; } .baseline { fill: #eb6834; } .oracle { fill: #1baf7a; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; } .axis { stroke: #383835; } .ring { stroke: #1a1a19; }
  .router { fill: #3987e5; } .baseline { fill: #d95926; } .oracle { fill: #199e70; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.tick { font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
<title id="t">Cost versus quality of each routing strategy</title>
<desc id="d">Quality and cost as a percentage of always using the large tier, on 119 held-out prompts. Full numbers are in reports/eval.md.</desc>
<rect class="surface" width="760" height="460" rx="8"/>
<text class="ink" x="20" y="30" font-size="16" font-weight="600">Cost vs quality, per routing strategy</text>
<text class="ink2" x="20" y="50" font-size="12">119 held-out prompts. Both axes relative to always using the large tier (Claude Sonnet 5.5) = 100%.</text>
<circle class="router" cx="25" cy="70" r="5"/>
<text class="ink2" x="35" y="74" font-size="12">Gearbox router</text>
<circle class="baseline" cx="153" cy="70" r="5"/>
<text class="ink2" x="163" y="74" font-size="12">fixed tier</text>
<circle class="oracle" cx="253" cy="70" r="5"/>
<text class="ink2" x="263" y="74" font-size="12">oracle (perfect labels)</text>
<line class="grid" x1="84" x2="610" y1="396.0" y2="396.0" stroke-width="1"/>
<text class="muted tick" x="76" y="400.0" text-anchor="end">50%</text>
<line class="grid" x1="84" x2="610" y1="337.5" y2="337.5" stroke-width="1"/>
<text class="muted tick" x="76" y="341.5" text-anchor="end">60%</text>
<line class="grid" x1="84" x2="610" y1="279.1" y2="279.1" stroke-width="1"/>
<text class="muted tick" x="76" y="283.1" text-anchor="end">70%</text>
<line class="grid" x1="84" x2="610" y1="220.6" y2="220.6" stroke-width="1"/>
<text class="muted tick" x="76" y="224.6" text-anchor="end">80%</text>
<line class="grid" x1="84" x2="610" y1="162.2" y2="162.2" stroke-width="1"/>
<text class="muted tick" x="76" y="166.2" text-anchor="end">90%</text>
<line class="grid" x1="84" x2="610" y1="103.7" y2="103.7" stroke-width="1"/>
<text class="muted tick" x="76" y="107.7" text-anchor="end">100%</text>
<line class="grid" x1="134.0" x2="134.0" y1="92" y2="396" stroke-width="1"/>
<text class="muted tick" x="134.0" y="414" text-anchor="middle">1%</text>
<line class="grid" x1="247.6" x2="247.6" y1="92" y2="396" stroke-width="1"/>
<text class="muted tick" x="247.6" y="414" text-anchor="middle">3%</text>
<line class="grid" x1="372.0" x2="372.0" y1="92" y2="396" stroke-width="1"/>
<text class="muted tick" x="372.0" y="414" text-anchor="middle">10%</text>
<line class="grid" x1="485.6" x2="485.6" y1="92" y2="396" stroke-width="1"/>
<text class="muted tick" x="485.6" y="414" text-anchor="middle">30%</text>
<line class="grid" x1="610.0" x2="610.0" y1="92" y2="396" stroke-width="1"/>
<text class="muted tick" x="610.0" y="414" text-anchor="middle">100%</text>
<text class="muted tick" x="90.0" y="414" text-anchor="middle">free</text>
<line class="axis" x1="84" x2="610" y1="396" y2="396" stroke-width="1"/>
<text class="ink2" x="347" y="442" font-size="12" text-anchor="middle">cost (log scale)</text>
<text class="ink2" font-size="12" text-anchor="middle" transform="translate(26 244) rotate(-90)">quality (mean judge score)</text>
<circle class="baseline ring" cx="90.0" cy="353.3" r="6" stroke-width="2"/>
<circle class="baseline ring" cx="319.2" cy="134.7" r="6" stroke-width="2"/>
<circle class="baseline ring" cx="610.0" cy="103.7" r="6" stroke-width="2"/>
<circle class="oracle ring" cx="400.7" cy="113.0" r="6" stroke-width="2"/>
<circle class="router ring" cx="228.7" cy="290.8" r="6" stroke-width="2"/>
<circle class="router ring" cx="441.0" cy="158.6" r="6" stroke-width="2"/>
<circle class="router ring" cx="336.6" cy="134.7" r="6" stroke-width="2"/>
<text class="ink" x="100.0" y="357.3" font-size="12" text-anchor="start">always-S</text>
<text class="ink" x="309.2" y="138.7" font-size="12" text-anchor="end">always-M</text>
<text class="ink" x="620.0" y="107.7" font-size="12" text-anchor="start">always-L</text>
<text class="ink" x="410.7" y="117.0" font-size="12" text-anchor="start">oracle</text>
<text class="ink" x="238.7" y="294.8" font-size="12" text-anchor="start">v1-rules</text>
<text class="ink" x="451.0" y="162.6" font-size="12" text-anchor="start">v2-llm</text>
<text class="ink" x="346.6" y="138.7" font-size="12" text-anchor="start">v3-embed</text>
</svg>
