# The whole service: docker compose up --build   ->  http://localhost:8002
# Postgres for the request log, Redis for the answer cache, the API.
# Tier S (Ollama) runs on the host machine; tiers M and L need ANTHROPIC_API_KEY in .env.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gearbox
      POSTGRES_PASSWORD: gearbox
      POSTGRES_DB: gearbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearbox -d gearbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Bring the schema up to date, then serve. Fine for one API container; with several,
    # run the migration as its own deploy step so two never migrate at once.
    command: ["sh", "-c", "python -m alembic upgrade head && exec python -m gearbox.service"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gearbox:gearbox@db:5432/gearbox
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the host's Ollama on Linux too
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s  # loading the router's embedding model

volumes:
  pgdata:
