# Gearbox runtime config. Non-secret settings only: API keys live in .env.
# Swapping a tier's model is a change here, never in code.

# The three tiers, cheapest first. Model ids use LiteLLM's "provider/model" form.
# max_tokens is a hard ceiling per call (thinking tokens included), so one request
# can't run up a bill. 3000 leaves room for long essays and code: at 1500, the M3 pilot
# cut off 1 of 20 Sonnet answers mid-table. Tier S was picked by scripts/bench_tier_s.py (M1): llama3.2:3b
# answered 19/20 sample prompts at ~47 tokens/s; qwen3:4b always thinks first (even with
# think=false), so it took 15-25 s per answer.
tiers:
  S:
    model: ollama_chat/llama3.2:3b
    api_base: http://localhost:11434
    max_tokens: 3000
    timeout_s: 120   # local model on a laptop GPU: slow but free
  M:
    model: anthropic/claude-haiku-5-5
    max_tokens: 3000
    timeout_s: 120
  L:
    model: anthropic/claude-sonnet-5-5
    max_tokens: 3000
    timeout_s: 180   # a 3000-token Sonnet answer can take well over a minute

# Which router picks the tier, and each router's settings. Compare them with
# py -m gearbox.routers.compare (results in reports/routers.md).
routing:
  router: v3-embed
  v2_llm:
    tier: M                          # Haiku classifies; costs a call per request
    prompt: prompts/classifier_v1.md
  v3_embed:
    artifact: models/router_v3.json  # py -m gearbox.routers.embed train

# Scores answers 1-5 to make the labels (cheapest tier scoring >= 4). Sonnet, the
# strongest of the three tiers; whether it can be trusted is measured against human hand
# labels (Cohen's kappa), not assumed. Low effort: grading against a reference answer
# needs little thinking, and thinking tokens are billed as output.
judge:
  model: anthropic/claude-sonnet-5-5
  prompt: prompts/judge_v1.md
  effort: low
  max_tokens: 2000

# USD per million tokens (Anthropic first-party API, checked 2026-10-22 for Scout).
# Re-check on the pricing page before any paid run. Local models cost 0.
prices_usd_per_mtok:
  ollama_chat/llama3.2:3b:     {input: 0.00, output: 0.00}
  anthropic/claude-haiku-5-5:  {input: 0.10, output: 0.50}
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00}

# Anthropic bills in USD. Update this when you check the rate.
usd_to_gbp: 0.79
